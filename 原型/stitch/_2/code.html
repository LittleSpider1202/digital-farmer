<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&amp;family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#f1f5eb",
              "on-secondary-container": "#795548",
              "secondary": "#7a5649",
              "on-secondary-fixed": "#2e150b",
              "on-surface": "#181d17",
              "tertiary-container": "#b14b6f",
              "surface-dim": "#d7dbd2",
              "primary-container": "#2e7d32",
              "on-secondary-fixed-variant": "#603f33",
              "background": "#f7fbf0",
              "error": "#ba1a1a",
              "surface-variant": "#e0e4da",
              "surface-container-lowest": "#ffffff",
              "surface": "#f7fbf0",
              "tertiary": "#923357",
              "on-primary-fixed-variant": "#005312",
              "inverse-surface": "#2d322b",
              "on-surface-variant": "#40493d",
              "error-container": "#ffdad6",
              "on-tertiary-fixed": "#3f001c",
              "primary-fixed-dim": "#88d982",
              "on-secondary": "#ffffff",
              "outline-variant": "#bfcaba",
              "on-error": "#ffffff",
              "secondary-fixed": "#ffdbcf",
              "on-primary": "#ffffff",
              "on-tertiary-container": "#ffedf0",
              "on-tertiary-fixed-variant": "#7f2448",
              "on-primary-fixed": "#002204",
              "primary-fixed": "#a3f69c",
              "inverse-primary": "#88d982",
              "surface-container-high": "#e5eadf",
              "on-background": "#181d17",
              "primary": "#0d631b",
              "tertiary-fixed": "#ffd9e2",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#ebbcac",
              "surface-container-highest": "#e0e4da",
              "inverse-on-surface": "#eef2e8",
              "tertiary-fixed-dim": "#ffb1c7",
              "on-primary-container": "#cbffc2",
              "outline": "#707a6c",
              "surface-tint": "#1b6d24",
              "secondary-container": "#fdcdbc",
              "surface-container": "#ebefe5",
              "surface-bright": "#f7fbf0",
              "on-tertiary": "#ffffff"
            },
            fontFamily: {
              "headline": ["Lexend"],
              "body": ["Public Sans"],
              "label": ["Public Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-nav {
            background: rgba(241, 245, 235, 0.8);
            backdrop-filter: blur(20px);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #0d631b 0%, #2e7d32 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-[#f7fbf0] dark:bg-[#181d17]">
<div class="flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-150 text-[#0d631b] dark:text-[#2e7d32]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Lexend'] font-bold text-lg tracking-tight text-[#0d631b] dark:text-[#2e7d32]">上传诊断照片</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant">more_horiz</span>
</div>
</div>
<div class="bg-[#ebefe5] dark:bg-[#2a2f26] h-px w-full opacity-20"></div>
</header>
<main class="px-6 mt-6 space-y-8">
<!-- Camera / Upload Area -->
<section class="space-y-4">
<div class="flex justify-between items-end">
<div>
<h2 class="font-headline font-bold text-xl text-on-surface">拍摄病害部位</h2>
<p class="text-on-surface-variant text-sm mt-1">请确保光线充足，对焦清晰</p>
</div>
</div>
<!-- Main Upload Target -->
<div class="relative aspect-square w-full rounded-[2rem] overflow-hidden bg-surface-container-low group cursor-pointer active:scale-[0.98] transition-all duration-200">
<div class="absolute inset-0 flex flex-col items-center justify-center border-2 border-dashed border-outline-variant/30 m-4 rounded-[1.5rem] bg-surface-container-lowest/40">
<div class="w-20 h-20 rounded-full primary-gradient flex items-center justify-center text-white shadow-xl shadow-primary/20 mb-4">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="font-headline font-bold text-primary">点击拍照或上传</span>
<span class="text-xs text-on-surface-variant mt-2">支持 JPG, PNG 格式</span>
</div>
<!-- Decorative Corner Guides -->
<div class="absolute top-8 left-8 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-8 right-8 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-8 left-8 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-8 right-8 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
</div>
<!-- Visual Guide Tips -->
<div class="grid grid-cols-3 gap-3">
<div class="bg-surface-container p-3 rounded-xl flex flex-col items-center gap-2">
<div class="w-12 h-12 rounded-lg overflow-hidden bg-surface-dim">
<img class="w-full h-full object-cover grayscale opacity-50" data-alt="Close up of a healthy green leaf with clear veins and texture in soft natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5xbn3dWcSegNKShf05sFB9JV9aY53efmBvV8suN9WR3I6-YQOAEhVU2dZAsQeF19dvv4ZKCzq8PJZdL8ZLp7Nzw7MbMFPgdDzcyQyASBHbWtwHa8vhireEFycvRHH2SccMMfVY6XwBz8HBuq6Dk_dyy96fWZBbuzV6ZBeIxNeCx6tbq1wolBI-MXPYZ95OYZP4brr0vorRwEhc8W3WXfiqnd73LfzLqAZEdzGkyDYq_1cQhxJaBUmo54BxWsYs_doQNTFnwfbO-M6"/>
</div>
<span class="text-[10px] font-bold text-on-surface-variant text-center">距离适中</span>
</div>
<div class="bg-surface-container p-3 rounded-xl flex flex-col items-center gap-2">
<div class="w-12 h-12 rounded-lg overflow-hidden bg-surface-dim">
<img class="w-full h-full object-cover grayscale opacity-50" data-alt="Agricultural seedling with soil in focus, showing roots and soil structure in bright daylight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBx0425J1yM2iF_BNt8ELZEtqFDbPWaa75rsWjCRKsm0AExetkOcXK9eQDpin5HhAGud4iiahTWdH1Ly6oZnSawyXsE3a18YUd67w_EEbkR9kDUvWnLVWhFVDqxhhDaHK7zEOTfPzHK1XVf_hH9cYHN56EGPYU1KevVHP3o4RzbBkY77rZ7Ww2JO3D7FwCOssWC7kIjQAca5ywaduyHCjL-vYEJx1uZj6aoD8If8myBjQ2RnDSfilcQc2yKvJr9BVWYxEu0nKM2oU8v"/>
</div>
<span class="text-[10px] font-bold text-on-surface-variant text-center">对焦准确</span>
</div>
<div class="bg-surface-container p-3 rounded-xl flex flex-col items-center gap-2 border-2 border-primary/20 bg-primary-container/5">
<span class="material-symbols-outlined text-primary text-xl">lightbulb</span>
<span class="text-[10px] font-bold text-primary text-center">光线充足</span>
</div>
</div>
</section>
<!-- Crop Selection -->
<section class="space-y-4">
<h2 class="font-headline font-bold text-lg text-on-surface">选择作物类型</h2>
<div class="flex flex-wrap gap-3">
<!-- Chip Selected -->
<button class="px-5 py-3 rounded-full bg-primary-container text-on-primary-container font-bold text-sm shadow-sm flex items-center gap-2"><span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
                    水稻</button>
<!-- Chips Unselected -->
<button class="px-5 py-3 rounded-full bg-surface-container-high text-on-surface font-medium text-sm flex items-center gap-2 hover:bg-surface-variant transition-colors">小麦</button>
<button class="px-5 py-3 rounded-full bg-surface-container-high text-on-surface font-medium text-sm flex items-center gap-2 hover:bg-surface-variant transition-colors">玉米</button>
<button class="px-5 py-3 rounded-full bg-surface-container-high text-on-surface font-medium text-sm flex items-center gap-2 hover:bg-surface-variant transition-colors">蔬菜</button>
<button class="px-5 py-3 rounded-full bg-surface-container-high text-on-surface font-medium text-sm flex items-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
                    其他
                </button>
</div>
</section>
<!-- Problem Description -->
<section class="space-y-4">
<div class="flex justify-between items-center">
<h2 class="font-headline font-bold text-lg text-on-surface">问题描述</h2>
<span class="text-xs text-on-surface-variant font-medium">可选</span>
</div>
<div class="relative">
<textarea class="w-full h-32 p-4 rounded-2xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/50 text-sm resize-none" placeholder="请描述作物的异常表现，如叶片发黄、枯萎或虫害情况..."></textarea>
<div class="absolute bottom-3 right-4 flex gap-2">
<button class="p-2 rounded-lg bg-surface-container-high text-on-surface-variant active:scale-90 transition-transform">
<span class="material-symbols-outlined text-lg">mic</span>
</button>
</div>
</div>
</section>
<!-- Expert Consultation Teaser -->
<section class="bg-secondary-container/30 p-4 rounded-2xl flex items-center gap-4 border border-secondary/10">
<div class="w-12 h-12 rounded-full bg-secondary flex items-center justify-center text-white shrink-0">
<span class="material-symbols-outlined">support_agent</span>
</div>
<div class="flex-1">
<h3 class="font-bold text-sm text-on-secondary-fixed">需要专家协助？</h3>
<p class="text-xs text-on-secondary-fixed-variant">AI 诊断后可一键联系农技专家远程指导</p>
</div>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</section>
</main>
<!-- Bottom Action Area -->
<footer class="fixed bottom-0 left-0 w-full p-6 pb-10 bg-surface/80 backdrop-blur-xl z-50">
<button class="w-full h-14 primary-gradient rounded-2xl text-white font-headline font-bold text-lg shadow-lg shadow-primary/30 active:scale-[0.97] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">analytics</span>
            开始诊断
        </button>
</footer>
<!-- BottomNavBar (Hidden for task focus but included for system consistency) -->
<!-- Suppressed on this Task-Focused screen per logic: "Any sub-page featuring a 'Back' action implies a temporary departure" -->
</body></html>
