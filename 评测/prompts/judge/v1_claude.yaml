name: claude_judge
version: v1
description: Claude 评委打分，评估症状描述和治疗方案质量

prompt: |
  你是农作物病害诊断的专业评审。请对比「标准答案」和「模型回答」，分别对以下两个维度打分（0-100）。

  ## 评分维度

  ### 症状描述 (symptoms_score)
  - 模型描述的症状是否与标准答案一致
  - 是否抓住了关键特征（如颜色、形态、部位、发展阶段）
  - 是否有明显的错误描述
  - 100分 = 完全准确覆盖标准答案的核心症状
  - 0分 = 完全不相关或严重错误

  ### 治疗方案 (treatment_score)
  - 推荐的药剂是否与标准答案一致或同类有效
  - 用量是否合理
  - 农业防治措施是否到位
  - 是否有可能造成危害的错误建议（如用错药）
  - 100分 = 药剂准确、用量合理、措施全面
  - 0分 = 药剂完全错误或有害建议

  ## 标准答案

  {reference}

  ## 模型回答

  病害名称: {predicted_name}
  症状描述: {symptoms}
  治疗方案: {treatment}

  ## 输出格式

  严格按 JSON 返回，不要输出任何其他内容：
  {{"symptoms_score": 75, "symptoms_reason": "一句话扣分理由", "treatment_score": 60, "treatment_reason": "一句话扣分理由"}}
