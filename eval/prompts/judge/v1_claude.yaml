name: claude_judge
version: v1
description: Claude 评委打分，评估发病条件、症状描述和防治方案质量

prompt: |
  你是农作物病害诊断的专业评审。请对比「标准答案」和「模型回答」，分别对以下三个维度打分（0-100）。

  ## 评分维度

  ### 发病条件 (conditions_score)
  - 气候因素：温度、湿度、降雨等关键发病条件是否准确
  - 品种因素：感病品种特点、抗性分析是否到位
  - 栽培管理：播种、施肥、灌溉等人为因素是否覆盖
  - 100分 = 三方面因素准确且全面覆盖
  - 0分 = 完全不相关或严重错误

  ### 症状描述 (symptoms_score)
  - 模型描述的症状是否与标准答案一致
  - 是否按阶段（初期→典型→后期）描述清楚
  - 是否抓住了关键特征（如颜色、形态、部位、发展阶段）
  - 是否有明显的错误描述
  - 100分 = 完全准确覆盖标准答案的核心症状，阶段清晰
  - 0分 = 完全不相关或严重错误

  ### 防治方案 (treatment_score)
  - 农业防治：基础措施是否合理（轮作、密植、施肥、排水等）
  - 种子处理：拌种/包衣药剂成分是否正确
  - 药剂防治：推荐的药剂是否与标准答案一致或同类有效，用量是否合理，施用时期是否正确
  - 是否有可能造成危害的错误建议（如用错药）
  - 100分 = 三方面措施准确、药剂正确、用量合理、时期明确
  - 0分 = 药剂完全错误或有害建议

  ## 标准答案

  {reference}

  ## 模型回答

  病害名称: {predicted_name}
  发病条件: {conditions}
  症状描述: {symptoms}
  防治方案: {treatment}

  ## 输出格式

  严格按 JSON 返回，不要输出任何其他内容：
  {{"conditions_score": 70, "conditions_reason": "一句话扣分理由", "symptoms_score": 75, "symptoms_reason": "一句话扣分理由", "treatment_score": 60, "treatment_reason": "一句话扣分理由"}}
